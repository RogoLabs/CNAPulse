<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CNA Detail - CNAPulse</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>📊</text></svg>"
    />
    <script src="https://cdn.tailwindcss.com/3.4.1"></script>
    <script>
      tailwind.config = { darkMode: "class" };
    </script>
    <script
      src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"
      crossorigin="anonymous"
    ></script>
    <style>
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .fade-in {
        animation: fadeIn 0.6s ease-out;
      }
    </style>
  </head>
  <body class="bg-gray-50 dark:bg-gray-900 min-h-screen transition-colors">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
      <button
        onclick="toggleDarkMode()"
        class="fixed top-4 right-4 z-50 p-2 rounded-lg bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 transition-colors"
        title="Toggle dark mode"
      >
        <svg
          id="dark-icon"
          class="w-5 h-5 text-gray-800"
          fill="currentColor"
          viewBox="0 0 20 20"
        >
          <path
            d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"
          ></path>
        </svg>
        <svg
          id="light-icon"
          class="w-5 h-5 text-yellow-500 hidden"
          fill="currentColor"
          viewBox="0 0 20 20"
        >
          <path
            fill-rule="evenodd"
            d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z"
            clip-rule="evenodd"
          ></path>
        </svg>
      </button>
      <!-- Back Button -->
      <div class="mb-4 fade-in">
        <a
          href="index.html"
          class="inline-flex items-center text-gray-600 hover:text-gray-900 dark:text-gray-400 dark:hover:text-gray-100"
        >
          <svg
            class="w-5 h-5 mr-2"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M10 19l-7-7m0 0l7-7m-7 7h18"
            ></path>
          </svg>
          Back to Dashboard
        </a>
      </div>

      <!-- Loading State -->
      <div id="loading" class="text-center py-12">
        <div
          class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-gray-900"
        ></div>
        <p class="mt-4 text-gray-600 dark:text-gray-400">Loading CNA data...</p>
      </div>

      <!-- Error State -->
      <div
        id="error"
        class="hidden bg-red-50 border border-red-200 rounded-lg p-6"
      >
        <h2 class="text-lg font-semibold text-red-800 mb-2">
          Error Loading CNA
        </h2>
        <p class="text-red-600" id="error-message"></p>
      </div>

      <!-- CNA Content -->
      <div id="cna-content" class="hidden">
        <!-- Header Card -->
        <div
          class="bg-white dark:bg-gray-800 rounded-lg shadow p-6 mb-6 fade-in"
        >
          <div class="flex items-start justify-between">
            <div>
              <h1
                class="text-3xl font-bold text-gray-900 dark:text-gray-100 mb-2"
                id="cna-title"
              ></h1>
              <p class="text-gray-600 dark:text-gray-400" id="cna-subtitle"></p>
              <a
                id="cna-advisory-link"
                class="hidden inline-flex items-center mt-2 text-blue-600 hover:underline"
                target="_blank"
                rel="noopener noreferrer"
              >
                <svg
                  class="w-4 h-4 mr-1"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"
                  ></path>
                </svg>
                Security Advisories
              </a>
            </div>
            <span id="status-badge"></span>
          </div>
        </div>

        <!-- Metrics Row -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-6 fade-in">
          <div class="bg-white dark:bg-gray-800 rounded-lg shadow p-6">
            <p class="text-sm font-medium text-gray-500 dark:text-gray-400">
              Baseline Avg
            </p>
            <p class="text-xs text-gray-400">(Per 30 Days)</p>
            <p
              class="text-3xl font-bold text-gray-900 dark:text-gray-100 mt-2"
              id="metric-baseline"
            >
              0
            </p>
          </div>
          <div class="bg-white dark:bg-gray-800 rounded-lg shadow p-6">
            <p class="text-sm font-medium text-gray-500 dark:text-gray-400">
              Current Period
            </p>
            <p class="text-xs text-gray-400">(Last 30 Days)</p>
            <p
              class="text-3xl font-bold text-gray-900 dark:text-gray-100 mt-2"
              id="metric-current"
            >
              0
            </p>
          </div>
          <div class="bg-white dark:bg-gray-800 rounded-lg shadow p-6">
            <p class="text-sm font-medium text-gray-500 dark:text-gray-400">
              Deviation
            </p>
            <p
              class="text-3xl font-bold text-gray-900 dark:text-gray-100 mt-2"
              id="metric-deviation"
            >
              0%
            </p>
          </div>
          <div class="bg-white dark:bg-gray-800 rounded-lg shadow p-6">
            <p class="text-sm font-medium text-gray-500 dark:text-gray-400">
              Days Since Last CVE
            </p>
            <p
              class="text-3xl font-bold text-gray-900 dark:text-gray-100 mt-2"
              id="metric-days"
            >
              -
            </p>
          </div>
        </div>

        <!-- Chart Card -->
        <div class="bg-white dark:bg-gray-800 rounded-lg shadow p-6 fade-in">
          <h2
            class="text-xl font-semibold text-gray-900 dark:text-gray-100 mb-4"
          >
            Publishing Activity (Rolling 30-Day Windows)
          </h2>
          <p class="text-sm text-gray-600 dark:text-gray-400 mb-6">
            12 rolling 30-day baseline windows + current 30-day period
          </p>
          <div class="relative" style="height: 400px">
            <canvas id="timeline-chart"></canvas>
          </div>
        </div>
      </div>
    </div>

    <script src="cna-detail.js"></script>
  </body>
</html>
